version: '3.8'

services:
  postgres:
    build: database
    container_name: aero_db_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: aero_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
