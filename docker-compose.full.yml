version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: "aero_db_postgres:prod"
    build: database
    container_name: aero_db_postgres
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init_schema_postgresql.sql:/docker-entrypoint-initdb.d/init_schema_postgresql.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aero_network

  # FastAPI backend
  backend:
    image: "aero_db_backend:prod"
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aero_db_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./.env:/app/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aero_network
    command: >
      sh -c "cd /app/backend &&
             pip install -r requirements.txt &&
             python main.py"

  # React frontend
  frontend:
    image: "aero_db_frontend:prod"
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: aero_db_frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000/api
    # No volumes in production - using built image
    depends_on:
      - backend
    networks:
      - aero_network
    # In production, just run serve (already installed in Dockerfile)
    command: ["serve", "-s", "dist", "-l", "3000"]

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: aero_db_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - aero_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  aero_network:
    driver: bridge