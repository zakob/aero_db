version: '3.8'

services:
  # PostgreSQL database
  postgres:
    build: database
    container_name: aero_db_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: aero_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init_schema_postgresql.sql:/docker-entrypoint-initdb.d/init_schema_postgresql.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aero_network

  # FastAPI backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aero_db_backend
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aero_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      SECRET_KEY: your-secret-key-here-change-in-production
      DEBUG: "True"
      CORS_ORIGINS: "http://localhost:3000,http://frontend:3000"
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aero_network
    command: >
      sh -c "cd /app/backend &&
             pip install -r requirements.txt &&
             python main.py"

  # React frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: aero_db_frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      - backend
    networks:
      - aero_network
    command: >
      sh -c "cd /app/frontend &&
             npm install &&
             npm run dev -- --host 0.0.0.0"

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: aero_db_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - aero_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  aero_network:
    driver: bridge