version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: "aero_db_postgres:dev"
    build: database
    container_name: aero_db_postgres_dev
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aero_network_dev

  # FastAPI backend (development mode)
  backend:
    image: "aero_db_backend:dev"
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: aero_db_backend_dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./.env:/app/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aero_network_dev
    command: >
      sh -c "cd /app/backend &&
             pip install -r requirements.txt &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  # React frontend (development mode)
  frontend:
    image: "aero_db_frontend:dev"
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: aero_db_frontend_dev
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: ''
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    networks:
      - aero_network_dev
    stdin_open: true
    tty: true
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --logLevel info --clearScreen false"

volumes:
  postgres_data_dev:

networks:
  aero_network_dev:
    driver: bridge