version: '3.8'

services:
  # PostgreSQL database
  postgres:
    build: database
    container_name: aero_db_postgres_dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: aero_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aero_network_dev

  # FastAPI backend (development mode)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: aero_db_backend_dev
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aero_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      SECRET_KEY: dev-secret-key-change-in-production
      DEBUG: "True"
      CORS_ORIGINS: "http://localhost:3000,http://frontend:3000"
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aero_network_dev
    command: >
      sh -c "cd /app/backend &&
             pip install -r requirements.txt &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  # React frontend (development mode)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: aero_db_frontend_dev
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      - backend
    networks:
      - aero_network_dev
    command: >
      sh -c "cd /app/frontend &&
             npm install &&
             npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data_dev:

networks:
  aero_network_dev:
    driver: bridge